
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Challenge Portal</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <main class="page">
        <section class="login-container">
            <img
                src="src/assets/parents-challenge-logo.jpg"
                alt="Parents Challenge Colorado"
                class="logo"
            >
          
            <!--landing page-->
            <h1>Welcome to Your Parents Challenge Portal</h1>

            <form class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                    <a href="#" class="forgot-password">
                        Forgot Password
                    </a>
                </div>

                <button type="submit" class="sign-in-button">
                    Sign In
                </button>
            </form>

            <p class="enrollment">
                Enrolling for the first time?
                Click <a href="#">Here</a>
            </p>
        </section>

        <footer class="footer">
            Contact Us:
            <a href="mailto:info@parentschallenge.org">
                info@parentschallenge.org
            </a>
            <span class="separator">|</span>
            <a href="tel:5555555555">555-555-55</a>
        </footer>
    </main>
</body>
</html>
